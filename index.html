<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Typixel — Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111111;
      color: #ffffff;
    }

    /* =========================
       PORTFOLIO PREVIEW
    ========================= */

    .portfolio-preview {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(230, 57, 70, 0.12),
          transparent 40%
        ),
        #111111;
    }

    /* Background circles */

    .circle {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      pointer-events: none;
    }

    .circle-1 {
      width: 500px;
      height: 500px;
      top: -200px;
      left: -200px;
    }

    .circle-2 {
      width: 700px;
      height: 700px;
      bottom: -350px;
      right: -300px;
    }

    .circle-3 {
      width: 300px;
      height: 300px;
      top: 20%;
      right: 10%;
      border-color: rgba(230, 57, 70, 0.08);
    }

    .portfolio-content {
      width: 100%;
      max-width: 900px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* =========================
       STATUS
    ========================= */

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding: 10px 17px;

      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);

      border-radius: 50px;

      color: #bbbbbb;

      font-size: 13px;
      font-weight: 500;

      margin-bottom: 32px;

      backdrop-filter: blur(10px);
    }

    .status-dot {
      width: 8px;
      height: 8px;

      background: #e63946;

      border-radius: 50%;

      box-shadow: 0 0 12px rgba(230, 57, 70, 0.8);

      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.5);
        opacity: 0.5;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* =========================
       HEADING
    ========================= */

    .portfolio-content h1 {
      font-size: clamp(48px, 8vw, 100px);

      line-height: 0.95;

      letter-spacing: -5px;

      font-weight: 800;

      margin-bottom: 30px;
    }

    .portfolio-content h1 span {
      color: #e63946;
    }

    /* =========================
       DESCRIPTION
    ========================= */

    .portfolio-description {
      max-width: 600px;

      margin: 0 auto 38px;

      color: #999999;

      font-size: 17px;

      line-height: 1.7;
    }

    /* =========================
       BUTTON
    ========================= */

    .portfolio-btn {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      padding: 16px 26px;

      background: #e63946;

      color: #ffffff;

      text-decoration: none;

      border-radius: 9px;

      font-size: 15px;

      font-weight: 700;

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        background 0.3s ease;
    }

    .portfolio-btn-arrow {
      font-size: 20px;

      transition: transform 0.3s ease;
    }

    .portfolio-btn:hover {
      background: #ff4757;

      transform: translateY(-4px);

      box-shadow:
        0 15px 40px rgba(230, 57, 70, 0.3);
    }

    .portfolio-btn:hover .portfolio-btn-arrow {
      transform: translate(4px, -4px);
    }

    .portfolio-btn:active {
      transform: translateY(-1px);
    }

    /* =========================
       SMALL TEXT
    ========================= */

    .portfolio-note {
      margin-top: 20px;

      font-size: 12px;

      color: #666666;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {

      .portfolio-preview {
        min-height: 90vh;

        padding: 50px 20px;
      }

      .portfolio-content h1 {
        font-size: 54px;

        letter-spacing: -3px;
      }

      .portfolio-description {
        font-size: 15px;

        line-height: 1.6;
      }

      .portfolio-btn {
        width: 100%;

        max-width: 280px;
      }

      .circle-3 {
        display: none;
      }
    }

  </style>
</head>

<body>

  <!-- =========================
       PORTFOLIO PREVIEW SECTION
  ========================= -->

  <section class="portfolio-preview">

    <!-- Decorative background -->
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>

    <div class="portfolio-content">

      <!-- Status -->
      <div class="status-badge">
        <span class="status-dot"></span>
        Portfolio Updating
      </div>

      <!-- Heading -->
      <h1>
        Something <span>Better</span><br>
        Is Coming.
      </h1>

      <!-- Description -->
      <p class="portfolio-description">
        We're currently updating our portfolio with our latest
        creative work, branding projects, and visual designs.
        Until then, you can explore our existing work below.
      </p>

      <!-- Portfolio Button -->
      <a
        href="YOUR_GOOGLE_DRIVE_LINK"
        target="_blank"
        rel="noopener noreferrer"
        class="portfolio-btn"
      >
        View Portfolio

        <span class="portfolio-btn-arrow">
          ↗
        </span>
      </a>

      <!-- Note -->
      <p class="portfolio-note">
        Opens our portfolio in Google Drive
      </p>

    </div>

  </section>

</body>
</html>
